<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор фильма</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>Продажа билетов</h2>
    <h3>Выберите фильм</h3>

    <div class="menu">
        {% for movie in movies %}
            <a href="{{ url_for('business_bp.sessions', movie_id=movie.id_movie) }}">
                {{ movie.title }}
            </a>
        {% else %}
            <p>Список фильмов пуст.</p>
        {% endfor %}
    </div>

    <div class="nav" style="margin-top: 20px;">
        <a href="{{ url_for('main_menu') }}">В главное меню</a>
    </div>
</div>
</body>
</html>
