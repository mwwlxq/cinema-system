<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Продажа билетов - Выбор фильма</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>Продажа билетов</h2>
    <h3>Выберите фильм</h3>

    <div class="menu">
        {% for movie in movies %}
            <a href="{{ url_for('business_bp.sessions', movie_id=movie[0]) }}">{{ movie[1] }}</a>
        {% else %}
            <p>Нет доступных фильмов.</p>
        {% endfor %}
    </div>

    <div class="nav">
        <a href="{{ url_for('main_menu') }}">В главное меню</a>
    </div>
</div>
</body>
</html>
