<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор сеанса</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>Выберите сеанс</h2>

    <div class="menu">
        {% for session in sessions %}
            <!-- Используем ключи id_session, date, time -->
            <a href="{{ url_for('business_bp.seats', session_id=session.id_session) }}">
                {{ session.date }} в {{ session.time }}
            </a>
        {% else %}
            <p>На этот фильм пока нет сеансов.</p>
        {% endfor %}
    </div>

    <div class="nav" style="margin-top: 20px;">
        <a href="{{ url_for('business_bp.index') }}">Назад к фильмам</a>
    </div>
</div>
</body>
</html>
