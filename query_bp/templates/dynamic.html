<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ prod_title }}</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>{{ prod_title }}</h2>

    <table border="1" style="margin: 0 auto; border-collapse: collapse; width: 100%;">
        <thead>
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <!-- ВАЖНО: .values() берет только значения из словаря, пропуская ключи -->
                    {% for value in product.values() %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% else %}
                <tr>
                    <td colspan="{{ headers|length }}">Нет данных по заданным параметрам</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="nav" style="margin-top: 20px;">
        <a href="{{ url_for('query_bp.query_menu') }}">Назад к списку запросов</a>
    </div>
</div>
</body>
</html>
