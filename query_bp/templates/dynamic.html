<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат запроса</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css">
</head>
<body>
<div class="center">
    <h2>{{ prod_title }}</h2>
    <table>
        <tr>
            {% for header in headers %}
                <th>{{ header }}</th>
            {% endfor %}
        </tr>
        {% for product in products %}
            <tr>
                {% for value in product %}
                    <td>{{ value }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </table>
    <div class="nav">
        <a href="{{ url_for('query_bp.query_menu') }}">Меню запросов</a>
        <a href="{{ url_for('main_menu') }}">Главное меню</a>
    </div>
</div>
</body>
</html>
